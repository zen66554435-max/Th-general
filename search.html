{% extends "base.html" %}{% block content %}<div class="card"><h2>البحث</h2><form><input name="q" value="{{q}}" placeholder="ابحث"><button>بحث</button></form><h3>النتائج</h3>{% for p in products %}<article class="item"><b>{{p.name}}</b><span>{{p.description}}</span><span>${{p.price}}</span></article>{% else %}<p>لا توجد نتائج.</p>{% endfor %}<p class="hint">تحدي: راقب طريقة تعامل التطبيق مع مدخلات البحث.</p></div>{% endblock %}
